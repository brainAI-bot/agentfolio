name: agentfolio-shops-ci
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: shops_ci
      POSTGRES_USER: shops_ci
      POSTGRES_PASSWORD: shops_ci_only
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shops_ci -d shops_ci"]
      interval: 2s
      timeout: 2s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data
  minio:
    image: quay.io/minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: shops_ci
      MINIO_ROOT_PASSWORD: shops_ci_only_password
    ports:
      - "127.0.0.1:59000:9000"
      - "127.0.0.1:59001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 2s
      retries: 30
    tmpfs:
      - /data
