name: Shops CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: shops-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: shops

jobs:
  shops-unit-tests:
    name: Shops unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: shops/package-lock.json

      - name: Install Shops dependencies
        run: npm ci

      - name: Run Shops unit tests
        run: npm test

  shops-postgresql-migrations:
    name: Shops PostgreSQL migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: shops/package-lock.json

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client

      - name: Install Shops dependencies
        run: npm ci

      - name: Start disposable CI services
        run: docker compose -f compose.ci.yml up --detach --wait postgres

      - name: Wait for disposable PostgreSQL service
        env:
          SHOPS_REQUIRED_SERVICES: postgres
        run: npm run check:services

      - name: Test PostgreSQL migrations
        run: npm run test:migrations

      - name: Stop disposable CI services
        if: always()
        run: docker compose -f compose.ci.yml down --volumes
