name: AgentFolio CI On Merge

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agentfolio-ci-on-merge-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  merge-gate:
    name: AF6 AF10 merge gate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.86.0

      - name: Install dependencies
        run: npm ci

      - name: Validate roadmap ledger
        run: npm run lint:roadmap

      - name: Verify published SATP mainnet program accounts
        run: npm run verify:satp-mainnet-programs

      - name: Run deep-audit regression ledger
        run: node --test tests/deepaudit-af-surface-remediation.test.js tests/escrow-release-gate.test.js tests/escrow-v3-authority.test.js tests/escrow-v3-platform-fee.test.js

      - name: Run AgentFolio escrow source-pin unit tests
        run: cargo test --locked --manifest-path onchain/escrow_v3/Cargo.toml

      - name: Check committed diff hygiene
        run: git diff --check
